[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridle"
version = "0.1.0"
description = "A harness for robot skills — bring your own LLM, simulator and robot. Skills carry the contract they were trained under, so a rig mismatch is a startup error, not a silent failure."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Luca" }]
keywords = ["robotics", "reinforcement-learning", "manipulation", "grasping", "sim2real",
            "llm-agents", "embodied-ai", "maniskill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# bridle CORE has no dependencies at all — Contract, Runner, Trace, signals, geometry, calibrate and
# checkpoint are stdlib-only, so they import on any machine and test without a GPU. That is a design
# constraint, not an accident: the moment core needs torch, "testable without the simulator" dies and
# with it the ability to unit-test the contract that the simulator is supposed to obey.
dependencies = []

[project.optional-dependencies]
# Adapters DO need a backend. Kept optional so `pip install bridle` stays weightless.
maniskill = ["torch"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/luke14free/bridle"

# FLAT LAYOUT (bridle/ at the repo root) rather than src/. The reference consumer imports bridle off
# PYTHONPATH as well as via the editable install, and a src/ move breaks the former the moment the
# install lags. Packaging must not be able to take a running robot down.
[tool.setuptools]
# bridle.tests is EXCLUDED from the wheel on purpose: tests are for the repo, not the distribution.
packages = ["bridle", "bridle.adapters"]

[tool.pytest.ini_options]
testpaths = ["bridle/tests"]
python_files = ["test_*.py"]
